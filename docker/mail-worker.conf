[program:bangkiang-mail]
command=php /var/www/html/artisan queue:work database --queue=mail --sleep=3 --tries=5 --timeout=60 --max-time=3600
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=90
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/mail-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
